<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <select name="" id="selectColor">
        <option value="orange" id="orange">orange</option>
        <option value="green" id="green">green</option>
        <option value="yellow" id="yellow">yellow</option>
        <option value="red" id="red"> red</option>
    </select>
    

    <script>
        document.getElementById("selectColor").addEventListener("change",function(e){
            
            const color = e.target.value;
            console.log(color)
            document.body.style.backgroundColor= `${color}`
        })
    </script>

</body>
</html>
