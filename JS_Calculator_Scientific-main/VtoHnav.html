<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            background: #459;
            display: flex;
            flex-direction: row;
            width: 100%;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            flex-direction: row;
            margin: 0;
            padding: 0;
        }

        .navbar li {
            margin: 0;
        }

        .navbar a {
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            color: white;
        }

        .navbar a:hover {
            background-color: green;
        }

        .navbar.vertical {
            flex-direction: column;
            width: 200px;

            height: 100vh;

        }

        .navbar.vertical ul {
            flex-direction: column;
            width: 100%;
        }

        .navbar.vertical li {
            width: 100%;
        }

        .navbar.vertical a {
            padding: 15px;
            border-bottom: 1px solid #444;
        }
    </style>
</head>

<body>

    <nav class="navbar" id="navbar">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <button onclick="toggleNav()" id="toglebtn">Toggle Layout</button>

    <script>
        function toggleNav() {
            document.getElementById("navbar").classList.toggle("vertical");
            const btn = document.getElementById("toglebtn")

        }
    </script>

</body>

</html>
